<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TravelBloom - Discover and explore dream travel destinations with curated recommendations for beaches, temples, and countries.">
  <title>TravelBloom - Explore Dream Destinations</title>
  <link rel="stylesheet" href="./travel_recommendation.css">
</head>
<body>
  <!-- Background Image with Overlay -->
  <div class="page-background"></div>

  <!-- Task 2: Navbar with required 6 elements: Home, About Us, Contact Us, Search Input, Search Button, Reset/Clear Button -->
  <nav class="navbar" id="main-navbar">
    <a href="./travel_recommendation.html" class="brand-logo" id="brand-logo">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </svg>
      </div>
      <span>TravelBloom</span>
    </a>

    <ul class="nav-links">
      <li><a href="./travel_recommendation.html" class="active" id="nav-home">Home</a></li>
      <li><a href="./about_us.html" id="nav-about">About Us</a></li>
      <li><a href="./contact_us.html" id="nav-contact">Contact Us</a></li>
    </ul>

    <div class="nav-search">
      <div class="search-input-wrapper">
        <svg class="search-icon-inside" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="search-input" placeholder="Enter a destination or keyword">
      </div>
      <button type="button" class="btn-search" id="btn-search">Search</button>
      <button type="button" class="btn-reset" id="btn-reset">Clear</button>
    </div>
  </nav>

  <!-- Social Media Floating Sidebar -->
  <aside class="social-sidebar" aria-label="Social links">
    <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" class="social-link" title="Twitter / X" aria-label="Twitter">

    </a>
    <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="social-link" title="Facebook" aria-label="Facebook">
      <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
    </a>
    <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="social-link" title="Instagram" aria-label="Instagram">
      <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
    </a>
    <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="social-link" title="YouTube" aria-label="YouTube">
      <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
    </a>
  </aside>

  <!-- Task 3: Home Page Content Section & Task 8 Recommendations Section -->
  <main class="main-container">
    <section class="hero-content">
      <div class="hero-tagline">
        <span>✨</span> Explore The World
      </div>
      <h1 class="hero-title">
        EXPLORE <br><span>DREAM</span> DESTINATION
      </h1>
      <p class="hero-description">
        It encourages exploration of unfamiliar territories, embracing diverse cultures and landscapes, while pursuing the desired destination that captivates the heart and ignites the wanderlust within.
      </p>
      <button type="button" class="btn-book-now" onclick="alert('Welcome! Start planning your dream vacation today.')">
        Book Now
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42L16.86 11H5v2z"/>
        </svg>
      </button>
    </section>

    <!-- Task 8: Recommendation Results (using display: grid) -->
    <section class="recommendations-section" id="recommendations-section">
      <div id="recommendation-results" class="results-grid"></div>
    </section>
  </main>

  <script src="./travel_recommendation.js"></script>
</body>
</html>
